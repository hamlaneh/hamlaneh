# golangci-lint v2 configuration for the Hamlaneh server.
# Strict but maintainable: correctness and security linters on, style left
# to gofmt/goimports and revive's core rules.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - copyloopvar
    - bodyclose
    - noctx
    # security
    - gosec
    # style / maintainability
    - revive
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # micro-optimization; hurts readability
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      # Tests may use fixed test URLs, ignore some hardening rules, and
      # exercise error paths in ways gosec flags as suspicious.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
