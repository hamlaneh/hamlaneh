# Hamlaneh CI — Phase 0 walking-skeleton pipeline.
#
# CI hygiene (CLAUDE.md "CI gates"):
#   - Every third-party action is pinned by full commit SHA; the trailing comment
#     records the version tag and Dependabot keeps both in sync.
#   - Minimal token permissions: contents: read at the top level; individual jobs
#     opt in to the least extra scope they need.
#   - No pull_request_target anywhere.
#   - Superseded runs are cancelled via the concurrency group (never on main).
#   - Secrets are never echoed: the compose-smoke DB password is generated per run,
#     written only to a runner temp file, and no step prints it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detects which parts of the repo a pull request touches so unrelated jobs are
  # skipped (server-only changes skip the webapp job and vice versa). Pushes to
  # main and manual dispatches always run every job. gitleaks always runs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      webapp: ${{ steps.filter.outputs.webapp }}
      deploy: ${{ steps.filter.outputs.deploy }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            server:
              - 'server/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            webapp:
              - 'webapp/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            # webapp/ is in this list because the server image builds and
            # embeds it: a webapp-only change still changes what the stack
            # serves, so the smoke test has to run.
            deploy:
              - 'server/**'
              - 'webapp/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            # The e2e suite drives the composed stack, so it is sensitive to
            # exactly the same three trees as compose-smoke: the frontend it
            # clicks, the server that serves it, and the deployment that
            # wires the two together.
            e2e:
              - 'server/**'
              - 'webapp/**'
              - 'deploy/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'

  server:
    name: Server (Go)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Throwaway CI database for storage integration tests; the password is
        # per-run and gates nothing outside this ephemeral runner.
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: hamlaneh_test
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: hamlaneh_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hamlaneh_test -d hamlaneh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Check generated code is in sync with docs/api/openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.0
          working-directory: server

      - name: Test (race detector + storage integration)
        env:
          HAMLANEH_TEST_DSN: postgres://hamlaneh_test:ci-${{ github.run_id }}@localhost:5432/hamlaneh_test?sslmode=disable
        run: go test -race ./...

      - name: Coverage floors — security-critical packages ≥95% (CLAUDE.md)
        run: |
          set -euo pipefail
          for pkg in ./internal/authz ./internal/session ./internal/password ./internal/ratelimit; do
            pct="$(go test -cover "$pkg" | grep -o 'coverage: [0-9.]*%' | grep -o '[0-9.]*' | head -n1)"
            echo "$pkg statement coverage: ${pct}%"
            awk -v p="$pct" 'BEGIN { exit (p+0 >= 95.0) ? 0 : 1 }' || {
              echo "::error::coverage ${pct}% is below the 95% floor in $pkg"
              exit 1
            }
          done

      - name: Security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  webapp:
    name: Webapp (TypeScript)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    # 30, not 20: the MLS wasm toolchain image costs ~5-6 minutes cold.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Current LTS, per CLAUDE.md "Commands & toolchain".
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types are in sync with docs/api/openapi.yaml
        run: |
          npm run api:gen
          git diff --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the MLS wasm wrapper
        # The same script a dev machine runs, so CI can never pass on a
        # toolchain nobody else has. This makes the wasm round-trip tests
        # run rather than skip, and `npm run build` below resolve the
        # `hamlaneh-mls` alias. Cold cost is dominated by compiling
        # wasm-bindgen-cli inside the toolchain image (~5 min); when that
        # hurts enough, the fix is publishing the toolchain image to GHCR
        # from a scheduled job, not a second build definition.
        run: bash src-mls/build.sh

      - name: MLS crate advisory scan (cargo audit)
        # ADR 006: the critical hpke-rs advisories sat one layer below the
        # audited library, which is the whole argument for this gate.
        run: |
          MSYS_NO_PATHCONV=1 docker run --rm \
            -v "$PWD/src-mls:/crate" -w /crate \
            hamlaneh-mls-build cargo audit

      - name: Test
        run: npm test

      - name: Locale key parity (en/fa)
        run: npm run i18n:check

      - name: Build
        run: npm run build

  # Also carries the two Phase 2 media gates, because they are ordinary specs
  # in the same suite against the same stack and there is nothing to add:
  #
  #   calls-relay-only.e2e.ts  ROADMAP §2 gate 2 — two browsers forced to
  #                            relay-only ICE complete a call, with a live
  #                            control probe proving the relay port is not
  #                            reachable from outside the media container.
  #   livekit-key-leak.e2e.ts  the media API secret appears in no response
  #                            body, header, WebSocket frame or served asset.
  #
  # PER PULL REQUEST, not nightly, and deliberately: both guard a claim that a
  # single line of deploy config can silently break (a published port, an
  # advertised address, a token field), and a gate that only turns red at 02:30
  # is a gate that gets found the morning after the change has been merged and
  # forgotten. Together they cost under two minutes on top of a job whose
  # `docker compose up --build` already dominates. The nightly workflow runs
  # them again in the both-locales tier; the specs themselves skip the second
  # locale, since neither measures anything a translation can move.
  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # The stack build dominates: a cold `docker compose up --build` is a few
    # minutes, the browser run a couple more.
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Install the browser
        working-directory: webapp
        # `npx playwright` runs the binary from node_modules, so the browser
        # build always matches the @playwright/test version npm ci installed
        # from the committed lockfile. Chromium only: that is what the
        # config's single device profile uses.
        run: npx playwright install --with-deps chromium

      - name: Run the suite (full en + fa smoke subset, media gates included)
        working-directory: webapp
        # The suite starts and stops the stack itself, under its own compose
        # project name; see webapp/e2e/support/stack.ts. The media gates need
        # the runner to be the Docker host — it is, and calls-relay-only skips
        # itself with the reason stated anywhere it is not.
        run: npm run e2e

      - name: Upload the report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          # test-results/ carries the trace, video and screenshot of every
          # failure plus the stack's own logs; a red run with neither is
          # nearly unactionable.
          path: |
            webapp/playwright-report/
            webapp/test-results/
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks ACTION requires a paid licence key for repositories owned
      # by an organisation. The gitleaks CLI itself is MIT-licensed and is the
      # same scanner, so we run the binary directly: no licence, no secret to
      # manage. The release tarball is pinned by version AND verified against a
      # SHA-256 recorded here, so a swapped release fails the job rather than
      # silently scanning with someone else's binary.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
          # -v prints file, line and rule for each finding; --redact keeps the value
          # itself out of the log. Without -v the job reports only a count, which
          # tells a contributor that something leaked but not what or where.
          ./gitleaks git --redact --no-banner -v --exit-code 1 .

  compose-smoke:
    name: Compose smoke (deploy stack)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate throwaway environment file
        # Every secret is random per run, exists only in the runner temp
        # directory, and is never printed. Nothing is hard-coded.
        run: |
          umask 077
          env_file="$RUNNER_TEMP/compose-smoke.env"
          {
            echo "HAMLANEH_DOMAIN=localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "HAMLANEH_FILE_URL_KEY=$(openssl rand -hex 32)"
            echo "HAMLANEH_AUDIT_KEY=$(openssl rand -hex 32)"
          } > "$env_file"
          echo "COMPOSE=docker compose -f deploy/docker-compose.yml --env-file $env_file" >> "$GITHUB_ENV"

      - name: Build and start the stack
        run: $COMPOSE up -d --build

      - name: Wait for all services to report healthy
        run: |
          deadline=$((SECONDS + 300))
          while true; do
            state="$($COMPOSE ps --all --format json | jq -s 'flatten')"
            count="$(jq 'length' <<<"$state")"
            exited="$(jq '[.[] | select(.State == "exited" or .State == "dead")] | length' <<<"$state")"
            pending="$(jq '[.[] | select(.State != "running" or ((.Health // "") != "" and .Health != "healthy"))] | length' <<<"$state")"
            if [ "$exited" -gt 0 ]; then
              echo "::error::A service exited during startup"
              $COMPOSE ps --all
              exit 1
            fi
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $count services are running and healthy"
              $COMPOSE ps
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for services to become healthy"
              $COMPOSE ps --all
              exit 1
            fi
            sleep 5
          done

      - name: Check health endpoint and web application through Caddy
        # HAMLANEH_DOMAIN=localhost means Caddy issues a certificate from its
        # internal CA, hence -k (the smoke test checks reachability and status,
        # not the public trust chain).
        #
        # A bare 200 on / is not enough: this job passed for a whole phase
        # against a placeholder page that said sign-in did not work. The page
        # must reference the content-hashed bundle a real `npm run build`
        # emits, and that bundle must be fetchable.
        run: |
          set -euo pipefail
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/healthz
          html="$(curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/)"
          asset="$(grep -o '/assets/[A-Za-z0-9._-]*\.js' <<<"$html" | head -n 1)"
          if [ -z "$asset" ]; then
            echo "::error::/ served no /assets/*.js bundle — the web application did not ship"
            exit 1
          fi
          echo "web application bundle: $asset"
          curl -fsSk -o /dev/null "https://localhost${asset}"

      - name: Verify secure defaults
        env:
          HAMLANEH_DOMAIN: localhost
        run: bash deploy/verify-defaults.sh

      - name: Dump service state and logs on failure
        if: failure()
        run: |
          if [ -n "${COMPOSE:-}" ]; then
            $COMPOSE ps --all || true
            $COMPOSE logs --no-color || true
          fi

      - name: Tear down
        if: always()
        run: |
          if [ -n "${COMPOSE:-}" ]; then
            $COMPOSE down -v --remove-orphans
          fi
