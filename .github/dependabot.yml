# Dependabot configuration (CLAUDE.md "CI gates": Dependabot enabled).
# Weekly updates for every ecosystem in the monorepo. Commit-message prefixes
# follow the repo's Conventional Commits rule.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
