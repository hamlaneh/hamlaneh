# Hamlaneh deployment stack (Phase 0 walking skeleton).
#
# Topology:
#   internet -> caddy (TLS + HSTS) -> server (:8080) -> db
#                                  \-> livekit (:7880, /rtc only)
#   internet -> livekit directly on the three media ports (UDP/TCP, no TLS)
#
# The server carries the built web application inside its binary and sets the
# application's content-security headers itself; Caddy owns only what a TLS
# terminator owns. See the ownership note in Caddyfile before moving either.
#
# Security posture (see docs/ROADMAP.md Phase 0):
#   - every container runs as a non-root UID with a read-only root FS,
#     all capabilities dropped and no-new-privileges set
#   - the database sits on an internal-only network, is never published
#     to the host, and only the server can reach it
#   - no secrets in this file: real values live in deploy/.env, which is
#     generated by install.sh and never committed (.env.example documents it)
#
# Usage (from deploy/):  docker compose up -d --build

name: hamlaneh

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile.caddy
    user: "65532:65532"
    # Lets the non-root Caddy process bind :80/:443 without root or any
    # added capability (cap_add NET_BIND_SERVICE does not work for
    # non-root users under Docker; this namespaced sysctl does).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      HAMLANEH_DOMAIN: ${HAMLANEH_DOMAIN:-localhost}
      # Its own variable, not "files." glued onto the one above: see the
      # Caddyfile block that reads it.
      HAMLANEH_FILES_DOMAIN: ${HAMLANEH_FILES_DOMAIN:-files.localhost}
      # The name to assume for a TLS client that sends none — every client
      # that connects by IP address. install.sh writes the app's host here,
      # port stripped; see the Caddyfile's global block for why.
      HAMLANEH_DEFAULT_SNI: ${HAMLANEH_DEFAULT_SNI:-localhost}
      # "internal" for an IP or localhost install, "acme" for a domain —
      # a public IP gets no certificate from Caddy unless told to issue one
      # itself. install.sh writes it; the Caddyfile's global block explains.
      HAMLANEH_CERT_ISSUER: ${HAMLANEH_CERT_ISSUER:-acme}
    ports:
      # The web ports are host-configurable for one deployment shape: a
      # server where something else already holds 80/443 (install.sh asks,
      # and only offers it for an IP address — a domain's publicly trusted
      # certificate is issued over 80/443, so a domain on custom ports would
      # order a certificate that can never arrive). When HAMLANEH_HTTPS_PORT
      # is custom, HAMLANEH_DOMAIN carries the same :port, which is what
      # makes Caddy listen there and the server's allowed Origin match what
      # browsers actually send — one value, three consumers, no drift.
      - "${HAMLANEH_HTTP_PORT:-80}:80"
      - "${HAMLANEH_HTTPS_PORT:-443}:${HAMLANEH_HTTPS_PORT:-443}"
      - "${HAMLANEH_HTTPS_PORT:-443}:${HAMLANEH_HTTPS_PORT:-443}/udp" # HTTP/3 (QUIC)
    volumes:
      - caddy_data:/data # certificates and internal CA — must persist
      - caddy_config:/config
    tmpfs:
      - /tmp
    networks:
      - edge
    depends_on:
      server:
        condition: service_healthy
      # service_started, not service_healthy, on purpose: Caddy proxies /rtc
      # to LiveKit, so it needs the name to resolve — but chat must not go
      # down because the media plane is unwell. A LiveKit that is up but not
      # yet ready answers 502 on /rtc for a few seconds and recovers.
      livekit:
        condition: service_started
    healthcheck:
      # Caddy's admin endpoint listens on 127.0.0.1:2019 inside the
      # container only; it is never published to any network.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "65532:65532" # distroless "nonroot"
    environment:
      # Standard libpq variables, honored natively by pgx — no DSN string is
      # ever built, so the generated password needs no URL-escaping.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: hamlaneh
      PGUSER: hamlaneh
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env — generated by install.sh, see .env.example}
      PGSSLMODE: disable # db lives on the internal-only compose network
      # First-admin bootstrap: read by the server ONLY while the users table
      # is empty (install.sh generates these; empty values disable bootstrap).
      HAMLANEH_ADMIN_USERNAME: ${HAMLANEH_ADMIN_USERNAME:-}
      HAMLANEH_ADMIN_PASSWORD: ${HAMLANEH_ADMIN_PASSWORD:-}
      HAMLANEH_ADMIN_LOCALE: ${HAMLANEH_ADMIN_LOCALE:-en}
      # Absolute public origin, used to build emailed links. Caddy owns it,
      # so the server is told rather than left to guess.
      HAMLANEH_PUBLIC_URL: ${HAMLANEH_PUBLIC_URL:-https://${HAMLANEH_DOMAIN:-localhost}}
      # Password reset by email: an empty SMTP host disables it, which is the
      # zero-config default. Setting the host makes _FROM required, and a
      # half-configured transport stops startup (see .env.example).
      HAMLANEH_SMTP_HOST: ${HAMLANEH_SMTP_HOST:-}
      HAMLANEH_SMTP_PORT: ${HAMLANEH_SMTP_PORT:-}
      HAMLANEH_SMTP_FROM: ${HAMLANEH_SMTP_FROM:-}
      HAMLANEH_SMTP_FROM_NAME: ${HAMLANEH_SMTP_FROM_NAME:-}
      HAMLANEH_SMTP_ENCRYPTION: ${HAMLANEH_SMTP_ENCRYPTION:-}
      HAMLANEH_SMTP_USERNAME: ${HAMLANEH_SMTP_USERNAME:-}
      HAMLANEH_SMTP_PASSWORD: ${HAMLANEH_SMTP_PASSWORD:-}
      # Single sign-on: an empty issuer disables it, which is the zero-config
      # default. Set issuer, client id and secret together — a partial set
      # stops startup, and so does a configured provider with no public URL,
      # because the redirect URI is built from that and never from a request
      # header (see .env.example).
      HAMLANEH_OIDC_ISSUER: ${HAMLANEH_OIDC_ISSUER:-}
      HAMLANEH_OIDC_CLIENT_ID: ${HAMLANEH_OIDC_CLIENT_ID:-}
      HAMLANEH_OIDC_CLIENT_SECRET: ${HAMLANEH_OIDC_CLIENT_SECRET:-}
      HAMLANEH_OIDC_PROVIDER_NAME: ${HAMLANEH_OIDC_PROVIDER_NAME:-}
      # Signs the expiring URLs uploaded files are served by (ADR 003). The
      # files origin is cookie-less, so this key is what every file read is
      # authorized against; startup stops without it rather than inventing
      # one, which would invalidate every URL already minted on each restart.
      HAMLANEH_FILE_URL_KEY: ${HAMLANEH_FILE_URL_KEY:?set in deploy/.env — generated by install.sh, see .env.example}
      # Keys the hash chain over the audit log. Held outside the database on
      # purpose: it is what makes an edited or deleted row detectable, and a
      # key stored beside the rows would be stolen along with them. Startup
      # stops without it rather than recording entries nobody can verify.
      HAMLANEH_AUDIT_KEY: ${HAMLANEH_AUDIT_KEY:?set in deploy/.env — generated by install.sh, see .env.example}
      # Where uploaded bytes live. Postgres holds the metadata; the blobs are
      # files on this volume, named only after the server-generated UUID.
      HAMLANEH_DATA_DIR: /var/lib/hamlaneh
      # Calls (ADR 005). We hold the LiveKit API key and secret and are the
      # only thing that mints join tokens; LiveKit itself never sees a user.
      # Both are required — a half-configured pair stops the stack here rather
      # than at somebody's first call, exactly as a half-configured mail
      # transport stops the server.
      HAMLANEH_LIVEKIT_API_KEY: ${HAMLANEH_LIVEKIT_API_KEY:?set in deploy/.env — generated by install.sh, see .env.example}
      HAMLANEH_LIVEKIT_API_SECRET: ${HAMLANEH_LIVEKIT_API_SECRET:?set in deploy/.env — generated by install.sh, see .env.example}
      # Where the RoomService API lives. Plain http on the internal compose
      # network on purpose: this address is not routable from outside, and it
      # is the ONLY way LiveKit's admin API is reachable at all — Caddy
      # publishes /rtc and nothing else (see Caddyfile).
      HAMLANEH_LIVEKIT_URL: http://livekit:7880
    volumes:
      - file_data:/var/lib/hamlaneh
    # No ports published: only Caddy talks to the server.
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/hamlaneh-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The media plane (ADR 005). Carries voice, video and screen share; knows
  # nothing about users, channels or messages — a join token minted by the
  # server is the only thing it ever authorizes against.
  #
  # Ports. Exactly three are published, and each is named in ADR 005:
  #   3478/udp  TURN, embedded, cert-less (see the config below)
  #   7881/tcp  ICE over TCP, the fallback for UDP-blocking networks
  #   7882/udp  all WebRTC media, on ONE port (udp_port is a mux, not a range)
  # 7880 — the signal endpoint AND the RoomService admin API — is deliberately
  # NOT published. It is reachable only on the compose network: Caddy proxies
  # /rtc to it for signalling, and the server calls RoomService over it. A
  # published 7880 would put the admin API on the internet.
  livekit:
    <<: *hardening
    image: livekit/livekit-server:v1.13.6@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    # The image ships no USER, so it would run as root. It needs nothing
    # writable: the whole configuration arrives in the environment, there is
    # no state to persist (LiveKit's live room state IS the truth, ADR 005),
    # and nothing is ever written to disk — which is what lets read_only from
    # the hardening anchor stand with no tmpfs and no volume at all.
    user: "65532:65532"
    environment:
      # The key/secret pair, in LiveKit's own "key: secret" form. Kept out of
      # LIVEKIT_CONFIG below so the secret is one value in one variable rather
      # than a substring of a YAML blob.
      LIVEKIT_KEYS: "${HAMLANEH_LIVEKIT_API_KEY:?set in deploy/.env — generated by install.sh, see .env.example}: ${HAMLANEH_LIVEKIT_API_SECRET:?set in deploy/.env — generated by install.sh, see .env.example}"
      # LiveKit takes its ENTIRE configuration from this variable (it is the
      # env binding of --config-body). That is what keeps the container
      # read-only with no config file mounted anywhere.
      #
      # Do not use $ in this block: compose interpolates it before LiveKit
      # ever sees it.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          # A single UDP port for every participant's media, not a range.
          # This is the whole reason the published port list is three lines
          # long instead of ten thousand.
          udp_port: 7882
          # Discover the public address by STUN at boot and advertise that as
          # the ICE candidate. Without it a NAT'd install advertises its
          # container IP and no client outside the host can ever connect.
          use_external_ip: true
        turn:
          # Embedded TURN (ADR 005): LiveKit issues per-participant, expiring
          # TURN credentials over the already-authenticated signal connection,
          # so there is no credential-handout endpoint of ours to protect.
          #
          # udp_port alone, no tls_port: TURN/TLS wants a certificate and
          # Caddy owns ours and occupies 443. The accepted gap — a network
          # that permits ONLY TLS on 443 is not traversed — is ADR 005's, and
          # belongs in the hardening guide rather than being papered over.
          enabled: true
          udp_port: 3478
        room:
          # A join token must NOT be able to bring a room back. Our server
          # creates the room when it mints a ticket, and it is the only thing
          # that may -- a join ticket carries no roomCreate grant, so with
          # auto_create off LiveKit answers a join for a room that is not
          # there with 404 instead of instantiating one.
          #
          # That is what makes revocation durable. LiveKit tokens are
          # stateless and DeleteRoom does not invalidate them; a connected
          # participant is re-minted a ~10-minute token every five minutes and
          # the client auto-reconnects with it. Left on, a revoked guest is
          # disconnected once, reconnects, RECREATES the room and stays -- for
          # as long as they keep reconnecting inside their rolling token.
          # Ending the meeting has to mean it stays ended.
          auto_create: false
        webhook:
          # How the server learns a call started or ended, so it can tell the
          # rest of the channel. Without this block LiveKit delivers nothing:
          # calls still work, because clients read call state over REST, but
          # nobody who is not already looking at the channel finds out.
          #
          # Internal to the compose network -- the server's port is not
          # published -- and signed with the API key regardless, because the
          # app domain forwards unknown paths to the Go server, so the
          # signature check is the boundary rather than the network is.
          api_key: ${HAMLANEH_LIVEKIT_API_KEY:?set in deploy/.env - generated by install.sh}
          urls:
            - http://server:8080/livekit/webhook
        logging:
          level: info
    ports:
      - "3478:3478/udp" # TURN
      - "7881:7881" # ICE/TCP
      - "7882:7882/udp" # media
    networks:
      - edge
    healthcheck:
      # LiveKit's "/" is its health endpoint and answers 200 only once the
      # node is publishing stats. busybox wget ships in the image.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s # external-IP discovery does a STUN round trip first

  db:
    <<: *hardening
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70" # uid/gid of the "postgres" user in the alpine image
    environment:
      POSTGRES_DB: hamlaneh
      POSTGRES_USER: hamlaneh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env — generated by install.sh, see .env.example}
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql # unix socket directory
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamlaneh -d hamlaneh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true # no host or internet access; db is only reachable by the server

volumes:
  caddy_data:
  caddy_config:
  db_data:
  # Uploaded file bytes. Its ownership comes from the image: deploy/Dockerfile
  # ships /var/lib/hamlaneh owned by 65532, and Docker copies that through to
  # a fresh named volume — which is what lets the non-root, read-only-rootfs
  # server write to it at all.
  file_data:
