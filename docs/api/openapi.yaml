# Hamlaneh API contract — source of truth for backend and frontend codegen.
#
# OpenAPI 3.0.3 (not 3.1): oapi-codegen builds on kin-openapi, whose 3.1
# support is incomplete; 3.0.3 is the version both toolchains fully support.
#
# Change process (CLAUDE.md): only the orchestrator edits this file, before
# implementation agents are spawned. Codegen output must never drift (CI-checked):
#   server: go generate ./...            -> server/internal/api/*.gen.go
#   webapp: npm run api:gen              -> webapp/src/api/schema.d.ts
#
# Auth model (decided in Phase 1.1 design):
#   - Session and refresh tokens travel ONLY in HttpOnly+Secure+SameSite=Strict
#     cookies; they never appear in response bodies or URLs.
#   - State-changing requests additionally require the X-Hamlaneh-CSRF custom
#     header (double-submit defense; SameSite is the first line).
#   - A password-verified login on an account with two-step verification on
#     answers 202 and sets the HttpOnly hamlaneh_2fa challenge cookie
#     (path-scoped to /api/v1/auth/login/totp, five minutes, single-use).
#     Session cookies exist ONLY after the code verifies: cookies are the only
#     authority here, so minting them at password time and trusting the UI to
#     gate would make two-step verification decorative for a direct API caller.
#   - Endpoints marked with the `sessionCookie` security scheme require a
#     valid session; `adminOnly: true` in the description means the authz
#     matrix must cover anonymous/member/admin for it.
#
# Conversation model (Phase 1.2, ADR 001 — the instance is the organization):
#   - No org or team layer. Channels are flat: `public`, `private` or `dm`.
#   - Visibility is membership for every kind. A non-member gets 404 (never
#     403) on every channel-scoped path, so a channel's existence never leaks.
#     Org admins get no implicit access — they see the same 404.
#   - 403 is reserved for things the caller can see but may not do (editing
#     someone else's message).
#   - Realtime frames are NOT described here. The WebSocket protocol lives in
#     docs/api/ws-protocol.md, which carries its own machine-readable
#     operation table for the WS half of the authz-completeness gate.
openapi: 3.0.3
info:
  title: Hamlaneh API
  description: >
    Self-hosted team communication platform API. Phase 1.1 surface: health,
    authentication, current user, and the admin user-management endpoints that
    back the dashboard (public registration is off by default; users are
    created from the admin dashboard or via invite links). Phase 1.2 adds the
    messaging surface the chat shell needs: channels and 1:1 direct messages
    with membership, cursor-paged message history with idempotent send, edit
    and soft delete, per-user read positions, message search, and the
    WebSocket upgrade that carries realtime delivery. Phase 1.1b completes the
    identity surface: email password reset, TOTP two-step verification with
    recovery codes, and self-service session management.
  version: 0.6.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /
    description: Same-origin deployment behind Caddy.

tags:
  - name: system
    description: Liveness/readiness — no auth, no session.
  - name: auth
    description: Login, logout, session refresh.
  - name: users
    description: The authenticated user's own resources.
  - name: admin
    description: Dashboard endpoints — admin role required, authz-matrix covered.
  - name: channels
    description: Channels, direct messages, and their membership.
  - name: messages
    description: Message history, send, edit, soft delete, read positions.
  - name: search
    description: Search across the conversations the caller is a member of.
  - name: realtime
    description: WebSocket upgrade — frames are specified in docs/api/ws-protocol.md.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: Liveness probe (no dependencies checked).
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/instance:
    get:
      tags: [system]
      operationId: getInstance
      summary: Public instance capabilities and policy.
      description: >
        Unauthenticated: the sign-in screen needs it before anyone has a
        session. Carries the values a client would otherwise have to hard-code
        or guess. password_reset_available exists because a zero-config
        install has no mail server, and a "Forgot password?" link that
        silently goes nowhere is dishonest (CLAUDE.md principle 4) — the
        client hides the link when it is false.
      responses:
        "200":
          description: Instance capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceInfo"

  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: Readiness probe (database reachable, migrations applied).
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: A dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate with username/email and password.
      description: >
        Rate-limited. On success sets the session and refresh cookies and
        returns the authenticated user. Responses for unknown user and wrong
        password are identical (no account enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session cookies set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "202":
          description: >
            Password verified, but two-step verification is on: no session
            exists yet. The challenge cookie is set; complete sign-in at
            /api/v1/auth/login/totp. A distinct status so no client can
            mistake this for a signed-in state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login/totp:
    post:
      tags: [auth]
      operationId: completeTotpLogin
      summary: Complete a two-step sign-in with an authenticator or recovery code.
      description: >
        The second half of login. Authenticated by the hamlaneh_2fa challenge
        cookie the 202 login set — deliberately no security scheme here,
        mirroring /auth/refresh; the authz matrix classifies it as
        challenge-cookie-gated. `code` is the six-digit authenticator code or
        one unused recovery code (case-insensitive, hyphens optional); a
        recovery code is consumed by the attempt that uses it. An accepted
        authenticator code is never accepted twice, even inside its
        thirty-second window. Five wrong codes revoke the challenge and the
        caller starts again at the password step. On success the challenge is
        consumed and session cookies are set exactly as a plain login sets them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpLoginRequest"
      responses:
        "200":
          description: Authenticated; session cookies set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >
            No live challenge — missing, expired, consumed or revoked (code
            not_authenticated; return to the password step) — or a live
            challenge with a wrong code (code invalid_totp_code; the cells
            clear and the caller retries).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session and clear cookies.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked; cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new session.
      description: >
        Presenting an already-rotated refresh token revokes the whole token
        family (reuse detection) and returns 401.
      responses:
        "204":
          description: New session cookies set.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the authenticated user's password.
      description: >
        Requires the current password. Allowed (and required) while
        must_change_password is set. On success all OTHER sessions of the user
        are revoked; the current session stays valid and the flag clears.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; other sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current password incorrect (code invalid_current_password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/reset-request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password-reset email.
      description: >
        Enumeration-safe: 202 with an empty body whether or not the address
        matches an account, the token mint and hash run either way so timing
        does not distinguish them, and the mail is dispatched asynchronously
        so SMTP latency never sits on the response. Tokens are 256-bit,
        single-use, thirty-minute, stored as SHA-256; issuing a new one
        invalidates the account's previous unused tokens, so at most one link
        is ever live. Rate-limited per IP and per PRESENTED address — keyed to
        the string as typed, existing or not, because a limiter that only
        counted real accounts would itself leak which addresses exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: >
            Accepted. If that address belongs to an account a reset link is on
            its way — the response is identical either way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset-complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: Set a new password with an emailed reset token.
      description: >
        Consumes the token and stores the new password in one transaction.
        Unknown, expired and already-used tokens answer identically so a
        replayed link learns nothing. Completing a reset revokes EVERY session
        family — unlike change-password, which keeps the current one, because
        a reset means the old password may be in someone else's hands — clears
        must_change_password, and consumes the account's other outstanding
        reset tokens and pending two-step challenges. It does NOT disable
        two-step verification: the token proves control of the mailbox, not of
        the authenticator. No cookies are set; the user signs in fresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteRequest"
      responses:
        "204":
          description: Password replaced; every session family revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >
            Token unknown, expired or already used (code invalid_reset_token)
            — one answer for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: The authenticated user.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [users]
      operationId: updateCurrentUser
      summary: Change your own account settings.
      description: >
        Locale belongs on the account rather than only in the browser: a
        person who reads Persian reads it on their phone too, and a
        preference that lives in localStorage silently reverts on every new
        device and every cleared browser. The client still applies its local
        choice immediately — the round trip must not make the interface
        wait — and this is what makes the choice follow the person.

        Unlike its siblings this stays open while must_change_password is
        set. The forced-change screen renders the language switcher, so
        refusing the save there would leave a control that appears to work
        and silently does not; and choosing which language to read the
        password rules in is not something the gate exists to prevent.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/totp:
    get:
      tags: [users]
      operationId: getTotpStatus
      summary: The caller's two-step verification state (the Security card).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Two-step state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/totp/setup:
    post:
      tags: [users]
      operationId: startTotpSetup
      summary: Start (or restart) two-step verification setup.
      description: >
        Generates a fresh 160-bit secret and returns the manual key, the
        otpauth URI and a server-rendered QR (the settings handoff: rendered
        server-side from the secret, never a stored image). The pending setup
        lives one hour; calling again before activation replaces it, which is
        also why Cancel needs no endpoint. The account stays password-only
        until activate. Answers carry Cache-Control: no-store.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pending setup created or replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Two-step verification is already on (code totp_already_enabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me/totp/verify:
    post:
      tags: [users]
      operationId: verifyTotpSetup
      summary: Verify the first authenticator code (setup step 2).
      description: >
        Checks a six-digit code against the pending secret. A wrong code does
        not restart setup — the secret stays valid and the client clears the
        cells — but five wrong codes revoke the pending setup, because an
        uncapped verifier is a brute-force oracle. On success the ten recovery
        codes are generated and returned, shown exactly once (only argon2id
        hashes are kept). Two-step verification is still OFF until activate.
        Answers carry Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTotpSetupRequest"
      responses:
        "200":
          description: Code accepted; the recovery codes for step 3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Wrong code (code invalid_totp_code); the setup survives.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            No pending setup, it expired, or the attempt cap revoked it (code
            totp_setup_expired) — start again at step 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me/totp/activate:
    post:
      tags: [users]
      operationId: activateTotp
      summary: Turn two-step verification on (setup step 3).
      description: >
        The action behind the saved-the-codes acknowledgement. Only a VERIFIED
        pending setup activates: the server never turns two-step verification
        on for an account that has not proven its authenticator and been shown
        its recovery codes, so closing the panel at step 3 can never strand an
        account whose only fallback was never displayed.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Two-step verification is on for the next sign-in.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            Nothing to activate — no pending setup, not yet verified, or
            expired (code totp_setup_not_verified).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/oidc/start:
    get:
      tags: [auth]
      operationId: startOidcSignIn
      summary: Begin single sign-on.
      description: >
        Redirects to the configured identity provider's authorization endpoint
        with a fresh state, nonce and PKCE challenge, and sets a short-lived
        transaction cookie holding the values the callback must compare
        against.

        That cookie is SameSite=Lax, and it is the one place this server
        departs from Strict: the callback arrives as a top-level cross-site
        navigation from the provider, and a Strict cookie would not be sent
        with it. It carries only server-minted randomness, so it discloses
        nothing and is compared rather than trusted.

        There is no return-to parameter. The flow always lands on the
        application root, which removes the open-redirect class outright
        rather than defending against it.
      responses:
        "302":
          description: Go to the identity provider.
          headers:
            Location:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: >
            Single sign-on is not configured, or the provider's discovery
            document could not be fetched (code sso_unavailable). Password
            sign-in is unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: completeOidcSignIn
      summary: Return from the identity provider.
      description: >
        Verifies the transaction cookie's state against the query parameter,
        exchanges the code with the PKCE verifier, validates the identity
        token's issuer, audience, signature and expiry, and compares its nonce
        to the cookie's. The cookie is single-use and is cleared either way.

        Every outcome is a redirect, because this is a browser navigation
        rather than a client call, and every one of them lands on the
        application root. What differs is one query parameter, which the
        client reads once and strips from the address bar:

        * signed in - no parameter. The session cookies are set.
        * `?sso=totp` - the account has a second factor. The two-step
          challenge cookie is set and the client shows the challenge screen.
          The value names the method so the parameter survives WebAuthn
          arriving beside totp, the way TwoFactorChallenge.methods does.
          Nothing else is needed: the challenge travels in the cookie, so the
          screen sends only the code.
        * `?sso_error=<code>` - it did not work, with exactly one of
          sso_account_exists (the identity's email belongs to a local
          password account), sso_account_unknown (it matches nobody and
          just-in-time provisioning is off), or sso_failed (anything else).

        Landing everything on the root rather than on distinct paths keeps the
        server's enumerated route list unchanged, and means a stale or shared
        callback URL can never resolve to a screen that implies a state the
        visitor is not in.

        Text supplied by the provider is never reflected into the URL or the
        page; it goes to the server log. The three codes are a closed set, so
        a client meeting an unrecognised value treats it as sso_failed.
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Signed in, challenged, or sent back with an error code.
          headers:
            Location:
              schema: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Single sign-on is not configured (code sso_unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/me/oidc:
    post:
      tags: [users]
      operationId: linkOidcIdentity
      summary: Connect single sign-on to this account.
      description: >
        Answers with the provider redirect the browser should follow, and sets
        the same transaction cookie the sign-in flow uses, carrying the intent
        to link and the id of the signed-in account. The callback then records
        the identity against that account instead of minting a session.

        Binding the account id into a server-minted HttpOnly cookie, and the
        state into both the cookie and the URL, is what makes link fixation
        fail: the transaction exists only in the browser that started it.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Follow this to the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcRedirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            This account already has an identity linked (code
            sso_already_linked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Single sign-on is not configured (code sso_unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: unlinkOidcIdentity
      summary: Disconnect single sign-on from this account.
      description: >
        Refused when the account has no password, because unlinking would
        leave it with no way in at all. The recovery path for such an account
        is an administrator issuing a temporary password, which is also the
        break-glass door when the provider is unreachable.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The identity is no longer linked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Nothing was linked (code sso_not_linked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The account has no password, so this is its only way in (code
            sso_unlink_no_password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me/totp/disable:
    post:
      tags: [users]
      operationId: disableTotp
      summary: Turn two-step verification off.
      description: >
        Re-asks for the password (the design's confirm dialog). Removes the
        secret and invalidates every recovery code. Sessions are deliberately
        NOT revoked: the threat is a hijacked session entrenching itself, and
        revoking other families would punish only the legitimate user's
        devices while the attacker's own session survives. The password
        prompt, the rate limit and the audit log are the defences.

        Refused outright while the organisation requires two-step
        verification. Enforcement binds when a session is minted, so without
        this an account could enrol, sign in unflagged, switch the factor
        back off and keep refreshing — the policy would hold for everyone
        except the people it is aimed at.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "204":
          description: Two-step verification is off; recovery codes void.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Password incorrect (code invalid_current_password), or the
            organisation requires two-step verification (code
            totp_required_by_org).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Two-step verification is not on (code totp_not_enabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me/totp/recovery-codes:
    post:
      tags: [users]
      operationId: regenerateRecoveryCodes
      summary: Generate a fresh set of recovery codes.
      description: >
        Invalidates the entire previous set and returns ten new codes, shown
        exactly once. Re-asks for the password: minting sign-in credentials
        deserves the same posture as disabling the second factor.
        Answers carry Cache-Control: no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmRequest"
      responses:
        "200":
          description: The replacement set; every previous code is void.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Password incorrect (code invalid_current_password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Two-step verification is not on (code totp_not_enabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/me/sessions:
    get:
      tags: [users]
      operationId: listMySessions
      summary: Every device signed in to the caller's account.
      description: >
        One row per live session family — a device in the UI is a family
        (migration 0002). Deliberately unpaged, a knowing deviation from the
        cursor convention: the set is bounded by the thirty-day refresh TTL
        and the artboard draws a flat list. Current family first, then
        last_active_at descending.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's session families.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFamilyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/sessions/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        description: A session family belonging to the caller.
        schema: { type: string, format: uuid }
    delete:
      tags: [users]
      operationId: revokeSessionFamily
      summary: Sign one device out.
      description: >
        Revokes every generation of the family; its open WebSocket closes
        within ten seconds (the ws contract). Idempotent on the caller's own
        families. The current family refuses — the design gives that row no
        sign-out control, and signing this device out is logout, which also
        clears its cookies. A family that is not the caller's answers 404, so
        a guessed id never confirms another account's session.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The family is revoked (now, or already was).
        "400":
          description: >
            That family is the one making this request (code
            cannot_revoke_current_session) — use logout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such session family for this caller (code session_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/me/sessions/revoke-others:
    post:
      tags: [users]
      operationId: revokeOtherSessions
      summary: Sign out everywhere else.
      description: >
        Revokes every live family except the caller's own. 204 even when
        nothing else was signed in; the client already knows the count.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: All other families revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Directory of instance users (invite and DM pickers).
      description: >
        Backs the two people-pickers the chat shell draws: "Invite people" on a
        channel and the "+" beside Direct messages. Returns the reduced
        UserSummary shape only — never email, role, or password state. Ordered
        by username ascending; the cursor encodes the last row's
        (username, id).
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive filter over username and display name.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: One page of the user directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: List users (dashboard). adminOnly.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: >
            One page of users, in the admin shape — the table draws an
            active/inactive column and the org-settings screen counts
            accounts without a second factor, so the list has to carry both.
            A list whose rows lack a column the same screen renders would
            leave the dashboard learning a user's state only from the row it
            just changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: adminCreateUser
      summary: Create a user (dashboard). adminOnly.
      description: >
        The primary way users come into existence — public registration is off
        by default. Audit-logged.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username or email already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{userId}:
    patch:
      operationId: updateUserAdmin
      summary: Deactivate, reactivate, or change a user's role.
      description: >
        The row-action menu on the users table. Deactivation is the
        offboarding switch: it ends every session and closes every socket the
        user holds, and the confirm says so because that is the difference
        between it and a forced password reset, which deliberately leaves the
        session alive.

        Reactivation is the inverse and only that — it restores the ability
        to sign in, never the sessions that were killed.

        Removing the last admin is refused (409 last_admin), not warned
        about afterwards: an instance nobody can administer is unrecoverable
        without database access, and the dashboard must not be able to
        produce that state. Demoting yourself is likewise refused while you
        are the only admin. Deactivating yourself is refused outright
        (409 self_deactivation) — locking yourself out is never the intent
        the click expressed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserAdminRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Refused on a rule the dashboard must not be able to break
            (last_admin, self_deactivation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{userId}/reset-password:
    post:
      operationId: forcePasswordReset
      summary: Issue a new temporary password for a user.
      description: >
        Answers with the generated password **once**, in the only response
        that will ever carry it — it is stored as an argon2id hash like any
        other, so nothing can show it again. The account is marked
        must_change_password, and the user's existing session deliberately
        survives: this is the unlock path for somebody who forgot their
        password, not the offboarding path, and killing their session would
        make the two indistinguishable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The temporary password, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/scim/tokens:
    get:
      tags: [admin]
      operationId: listScimTokens
      summary: Provisioning tokens.
      description: >
        The tokens an identity provider's sync engine authenticates with.
        Never the tokens themselves — only their metadata, exactly as the
        invite list never carries a link.

        More than one live token is deliberate rather than an oversight:
        rotating a credential an external system holds needs an overlap, so
        an administrator mints the new one, updates the provider, and revokes
        the old one afterwards.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Every token that has not been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimTokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createScimToken
      summary: Mint a provisioning token.
      description: >
        Answers with the token **once**. Only its hash is stored, as invite
        links and reset tokens are, so a stolen database yields no usable
        credential and nothing can redisplay a value somebody closed the
        dialog on.

        This is a second door into the instance with its own credential, and
        it is not a session: it carries no cookie, no CSRF header, and it is
        refused everywhere under /api. A session cookie is equally worthless
        at the provisioning endpoints. Two doors, two credentials, neither
        usable at the other.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScimTokenRequest"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedScimToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/scim/tokens/{tokenId}:
    delete:
      tags: [admin]
      operationId: revokeScimToken
      summary: Revoke a provisioning token.
      description: >
        Takes effect immediately. The provider's next sync fails
        authentication, which is the intended way to cut off a system that
        should no longer be provisioning.
      security:
        - sessionCookie: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: The token is dead.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/invites:
    get:
      operationId: listInvites
      summary: Open invite links.
      description: >
        Only links that are still usable — an accepted or expired invite
        leaves the list, because the table's purpose is "what can still be
        redeemed", and the audit log is where the history lives. Ordered by
        expiry, soonest first, which is what the design flags.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: One page of open invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvite
      summary: Generate a single-use invite link.
      description: >
        Answers with the link **once**. Only its hash is stored, exactly as
        password-reset tokens are, so a stolen database yields no usable
        invitation and nothing can redisplay a link somebody closed the
        dialog on. Single-use and expiring; redeeming it creates the account
        and consumes the invite in one transaction, so two people racing the
        same link produce one account and one honest refusal.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite link, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke an open invite.
      description: >
        Idempotent: revoking one that is already gone answers 204, because
        the outcome the caller wanted is the outcome that holds.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Revoked, or already gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/invites/{token}:
    get:
      operationId: previewInvite
      summary: What this invite offers, before signing up.
      parameters:
        - name: token
          in: path
          required: true
          description: The invite token from the link.
          schema: { type: string, minLength: 20, maxLength: 128 }
      description: >
        Public: the redemption screen needs the org's name before anybody has
        an account. It answers only what the screen draws and never who
        issued it or for whom. An unknown, expired, revoked or already-used
        token answers the same 404, so a guessed token cannot be told from a
        spent one.
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: redeemInvite
      summary: Create an account from an invite.
      parameters:
        - name: token
          in: path
          required: true
          description: The invite token from the link.
          schema: { type: string, minLength: 20, maxLength: 128 }
      description: >
        Public, and the only way a user comes into existence when
        registration is closed. The invite is consumed in the same
        transaction that creates the account, so a link cannot make two
        people. Answers 404 for every unusable token, exactly as the preview
        does, and 409 username_taken when the name is gone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInviteRequest"
      responses:
        "201":
          description: Account created; sign in normally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That username is taken (code username_taken).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/org:
    get:
      operationId: getOrgSettings
      summary: The instance's own settings.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateOrgSettings
      summary: Change the instance's settings.
      description: >
        Saved immediately, field by field — the design has no Save button,
        because a button is a thing to forget. Only the fields present are
        changed.

        Turning 2FA enforcement on does not lock anybody out mid-session: it
        takes effect at the next sign-in, and the accounts without a second
        factor are reported so the admin can see who it will affect rather
        than discovering it from support requests.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgSettingsRequest"
      responses:
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit:
    get:
      operationId: listAuditEntries
      summary: The audit log.
      description: >
        Append-only and hash-chained: every entry carries the hash of the one
        before it, so an edited or deleted row breaks the chain from that
        point on. `chain_valid` reports the verification of the returned
        page, and a false there is not a display concern — it means somebody
        reached the database directly.

        Newest first, older/newer paging rather than numbered pages, because
        entries arrive while a page is being read.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
        - name: action
          in: query
          description: Filter to one action.
          schema: { type: string, maxLength: 64 }
        - name: actor_id
          in: query
          description: Filter to one actor.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of the log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: Every channel and DM the caller belongs to (the sidebar).
      description: >
        Membership is the only visibility rule in Phase 1.2, so this returns
        exactly what the sidebar draws: public channels, private channels and
        direct messages the caller is a member of, each carrying its unread and
        mention counts. Ordered by (created_at, id) ascending — the sidebar
        does its own grouping and display sort.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: One page of the caller's conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [channels]
      operationId: createChannel
      summary: Create a public or private channel.
      description: >
        The "+" beside Channels. The creator becomes the sole member, which is
        what the empty-channel state promises ("Only you can see this channel
        until someone is invited"). Direct messages are opened through
        /api/v1/dms instead — kind `dm` is rejected here.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created; the caller is its only member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already taken (code channel_slug_taken).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/dms:
    post:
      tags: [channels]
      operationId: openDirectMessage
      summary: Open — or reuse — the 1:1 direct message with one user.
      description: >
        The "+" beside Direct messages. Exactly one DM channel exists per user
        pair (ADR 001), so this is idempotent: 200 returns the channel that
        already existed, 201 reports one that was just created. Opening a DM
        with yourself is a 400.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenDirectMessageRequest"
      responses:
        "200":
          description: The direct message already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "201":
          description: Direct message created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user (code user_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [channels]
      operationId: getChannel
      summary: One channel or DM the caller belongs to.
      description: >
        Backs a deep link into a conversation (and a reload of one). A
        non-member — including an org admin who is not a member — gets 404, so
        the channel's existence never leaks.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: Set the channel topic.
      description: >
        Backs "Set a topic" in the empty-channel state and the topic line in
        the header. Any member may set it. Direct messages have no topic — a
        PATCH on a DM is a 400. Renaming a channel is not in this slice.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{channelId}/members:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [channels]
      operationId: listChannelMembers
      summary: Members of a channel (the count in the header).
      description: >
        Ordered by username ascending; the cursor encodes the last row's
        (username, user_id).
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [channels]
      operationId: addChannelMember
      summary: Invite a user into a channel.
      description: >
        Backs "Invite people". Any member may invite any user into a public or
        private channel. Idempotent — inviting somebody who is already a member
        changes nothing and still returns 204. A direct message's membership is
        fixed at two, so inviting into a DM is a 400 (code dm_membership_fixed).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddChannelMemberRequest"
      responses:
        "204":
          description: The user is a member (added now, or already was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            No such channel for this caller (code channel_not_found) or no such
            user (code user_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/channels/{channelId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [channels]
      operationId: removeChannelMember
      summary: Leave a channel, or remove somebody from it.
      description: >
        Leaving yourself is always allowed. Removing somebody else requires
        being the channel's creator, or an org admin who is a member of it —
        the same boundary as message moderation: admins hold no power in
        channels they are not in. Idempotent: removing a non-member returns
        204. A direct message's membership is fixed, so this is a 400 on a DM
        (code dm_membership_fixed). Removing the last member of a channel is
        refused (code last_member) — an empty channel nobody can reach is a
        leak of nothing but a dead row.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The user is not a member (removed now, or already was not).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Visible, but not the caller's to do — not the creator and not an
            admin member (code forbidden).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{channelId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags: [messages]
      operationId: listMessages
      summary: One page of channel history.
      description: >
        Pages with `before`, `after` or `around` — at most one of the three; two
        together is a 400. With no cursor at all, returns the newest `limit`
        messages: the channel as it looks when opened, which is the only page a
        client can render before it knows any message id. A cursor is opaque (base64 of the anchor message's
        created_at and id). Every page is ordered ascending by
        (created_at, id) so the client renders it in reading order regardless
        of the direction it paged in. `around` centres the page on the cursor
        and is how a copied message link resolves. Soft-deleted messages stay in
        the page with empty content and a deleted_at, because the design keeps a
        placeholder in their place.
      security:
        - sessionCookie: []
      parameters:
        - name: before
          in: query
          description: Return messages older than this cursor (scrollback).
          schema: { type: string }
        - name: after
          in: query
          description: Return messages newer than this cursor (reconnect backfill).
          schema: { type: string }
        - name: around
          in: query
          description: Centre the page on this cursor (permalinks); limit splits either side.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send a message.
      description: >
        Idempotent on `client_msg_id`, which the client generates once per
        message and reuses verbatim on every retry — a message queued while the
        socket was down lands exactly once. A first send returns 201; a resend
        of the same client_msg_id returns 200 with the message that already
        exists, unmodified.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: This client_msg_id was already sent; the existing message is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Message stored and broadcast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/channels/{channelId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit your own message.
      description: >
        Author-only, admins included — editing somebody else's words is
        impersonation, so an admin who is a member of the channel still gets
        403 (code not_message_author). The message keeps its place and gains an
        edited_at, which the design renders as "(edited)". Editing a deleted
        message is a 409.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: The edited message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The message is deleted (code message_deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message (soft).
      description: >
        The author may delete their own message; an org admin may delete any
        message in a channel they are a member of (code
        not_message_author_or_admin on refusal). Soft delete — the row keeps its
        place with its content erased, which is what the dashed "Message
        removed" placeholder renders. Idempotent: deleting an
        already-deleted message is still 204.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The message is deleted (now, or already was).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{channelId}/files:
    post:
      operationId: uploadFile
      summary: Upload one file into a channel.
      description: >
        Backs the composer's paperclip. One file per request — the composer
        uploads several as several requests, each with its own progress and
        its own failure. The file is scoped to this channel from birth:
        membership is checked here, the later message references it by id,
        and a file never attached to a message is swept after 24 hours. That
        one rule — a file is readable exactly by the members of its channel —
        keeps the authorization story identical to every other channel
        resource.

        The declared content type is kept as the card's label, but the server
        trusts the bytes, not the label: a declared image/* whose bytes do
        not sniff as that image type is refused (415, content_type_mismatch),
        because images are the one kind served inline. Everything else is
        stored as an opaque blob and always served as a download —
        Content-Disposition attachment, nosniff, sandboxing CSP — so an
        uploaded SVG, HTML page or anything else that can carry script is a
        file the reader saves, never a page their browser runs. Images have
        their metadata stripped at ingest: EXIF carries GPS coordinates, and
        a photo shared in a chat must not quietly say where its author lives.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: >
            Stored. The attachment's url and thumbnail_url are signed and
            expiring — the files origin is cookie-less, so possession of a
            fresh URL is the credential, and every serialization of an
            Attachment mints fresh ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such channel — including one the caller is not in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file exceeds max_file_size_bytes (code file_too_large).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >
            Declared image bytes that are not that image (code
            content_type_mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/channels/{channelId}/read:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    put:
      tags: [messages]
      operationId: setReadPosition
      summary: Move the caller's read position in a channel.
      description: >
        Feeds the "New messages" divider and the sidebar unread and mention
        counts. Monotonic per (user, channel): a position older than the one
        already stored is accepted and ignored, so a stale tab cannot undo a
        read. Own-device sync only — a read position is never visible to any
        other user, and the contract carries no cross-user read receipts
        anywhere.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReadPositionRequest"
      responses:
        "204":
          description: Read position stored, or ignored as a regression.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Search messages (and, from Phase 1.3, files).
      description: >
        Backs the search column. Scope is enforced inside the query by joining
        channel membership, so results, counts and snippets can never come from
        a conversation the caller is not in. Snippets are a parts array of
        {text, match} — the server never renders HTML; the design's highlight is
        drawn client-side from `match`. `total` is exact up to 200 and reports
        total_capped beyond that. `kind=files` is accepted now and returns an
        empty page until the Phase 1.3 upload pipeline exists; its result shape
        arrives with that slice.

        Results are newest-first. Chat search is almost always a hunt for
        something recent, and the alternative — relevance ranking — is not
        available under the substring matching this endpoint uses; migration
        0006's header records why that was chosen over a language-specific
        configuration.

        Rate limited per account rather than per address, because what a
        search costs depends on how many messages the caller can reach: a
        needle shorter than three characters cannot use the trigram index and
        scans instead, and the contract allows one that short on purpose,
        since one- and two-character words are ordinary in Persian.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/SearchKind"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response.
          schema: { type: string }
      responses:
        "200":
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/ws:
    get:
      tags: [realtime]
      operationId: connectWebSocket
      summary: Upgrade to the realtime WebSocket.
      description: >
        Authenticated by the session cookie on the upgrade request — never by a
        token in the URL. The handshake requires an Origin header matching the
        instance's public origin; a missing or mismatched Origin is rejected
        (CSWSH defense). The socket binds to the session family, so a cookie
        rotation does not drop it and revoking the family closes it within ten
        seconds. Frames, operations, resume and close codes are specified in
        docs/api/ws-protocol.md; this entry exists so the transport's
        authentication is covered by the authz matrix like any other endpoint.
      security:
        - sessionCookie: []
      responses:
        "101":
          description: Switching Protocols — the WebSocket is open.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Origin missing or not allowed (code origin_not_allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hamlaneh_session
      description: >
        HttpOnly+Secure+SameSite=Strict session cookie. Mutating requests must
        also send the X-Hamlaneh-CSRF header.

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      description: A channel or direct message the caller is a member of.
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }

    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired, or invalid session/credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed (authz denied).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        No such resource for this caller. Channel-scoped paths answer 404 —
        never 403 — to a non-member, so a channel's existence never leaks; an
        org admin who is not a member sees the same 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: >
        Too many attempts; retry later. Always carries Retry-After, so a client
        can show a real countdown instead of guessing — without it a form has no
        honest way to say when the door reopens.
      headers:
        Retry-After:
          description: >
            Whole seconds until the caller's budget frees up. Present on every
            429 this server sends: one function writes them all and it sets the
            header unconditionally, so carrying it is a property of the code
            rather than something each handler has to remember.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code (e.g. invalid_credentials).
            message:
              type: string
              description: Human-readable English message; clients localize by code.

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or email.
          minLength: 1
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024

    User:
      type: object
      required:
        [id, username, display_name, locale, is_admin, must_change_password,
         sso_linked, totp_enrollment_required, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
          nullable: true
        display_name:
          type: string
        locale:
          type: string
          enum: [en, fa]
        is_admin:
          type: boolean
        must_change_password:
          type: boolean
          description: >
            True until the user replaces their admin-assigned temporary password.
            While true, every endpoint except change-password, logout, reading
            and patching users/me returns 403 with code
            password_change_required.
        sso_linked:
          type: boolean
          description: >
            Whether this account has a single sign-on identity attached. It is
            what the settings screen offers Connect or Disconnect from.
        totp_enrollment_required:
          type: boolean
          description: >
            True when this session was minted while the organisation requires
            two-step verification and this account has none activated. While
            true, every endpoint except logout, reading and patching users/me,
            and the TOTP enrolment endpoints returns 403 with code
            totp_enrollment_required, and the WebSocket refuses the upgrade.
            Patching is admitted for the same reason the password gate admits
            it: the only field it carries is locale, and somebody whose
            account language is wrong would otherwise be stuck reading a
            screen they cannot change in a language they cannot read.

            It is a property of the session rather than of the account, which
            is what makes "at the next sign-in, never mid-session" true:
            turning the policy on strands nobody who is already working,
            including the administrator who turned it on.

            The two gates are sequential, not simultaneous: while
            must_change_password is also true, only that gate applies. An
            account an administrator created on an instance that requires
            two-step carries both flags on its first sign-in, and the two
            allow-lists intersect at almost nothing -- enforcing both at once
            would leave that person able to do neither thing being demanded of
            them. The password comes first because a temporary password is a
            credential its holder does not yet exclusively hold, and changing
            it revokes every other session, so enrolment then happens on a
            session nobody else could be sharing.
        created_at:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Present when another page exists.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024

    AdminCreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9][a-z0-9_.-]*$"
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
        password:
          type: string
          format: password
          description: Initial password; the user is forced to change it on first login.
          minLength: 12
          maxLength: 1024
        locale:
          type: string
          enum: [en, fa]
          default: en
        is_admin:
          type: boolean
          default: false

    InstanceInfo:
      type: object
      description: >
        What a client needs before it has a session. password_min_length is
        instance policy served with the form rather than a constant compiled
        into the client; password_reset_available is false when no mail
        transport is configured, so the sign-in screen can omit the link
        instead of offering one that goes nowhere.
      required: [password_min_length, password_reset_available, max_file_size_bytes]
      properties:
        max_file_size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            The per-file upload cap, published so a client can refuse a file
            before spending the user's bandwidth on a doomed request. The
            server enforces it regardless; this is a courtesy, not the check.
        password_min_length:
          type: integer
          minimum: 8
        password_reset_available:
          type: boolean
        sso:
          $ref: "#/components/schemas/SsoStatus"

    OidcRedirect:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: The provider authorization URL to send the browser to.

    SsoStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >
            False when no provider is configured. The sign-in screen renders
            the button only when the door exists, rather than offering one
            that goes nowhere.
        provider_name:
          type: string
          description: >
            What to call the provider on the button. Present whenever enabled
            is true, and absent otherwise - a configured provider always has a
            name, defaulting to a generic one, so a client never has to render
            a button it cannot label.

    TwoFactorChallenge:
      type: object
      description: >
        The 202 login answer for an account with two-step verification on.
        methods lists how the challenge may be completed; totp is the only
        method until WebAuthn arrives.
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          items:
            type: string
            enum: [totp]

    TotpLoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 16
          description: >
            A six-digit authenticator code, or one recovery code
            (XXXX-XXXX; case-insensitive, hyphens and spaces ignored).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordResetCompleteRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: The opaque token from the emailed link.
          minLength: 20
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024

    PasswordConfirmRequest:
      description: >
        Re-authentication for an action that changes the second factor. The
        session alone is not enough: a hijacked session must not be able to
        disable two-step verification or mint fresh sign-in codes.
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024

    TotpStatus:
      type: object
      description: >
        The Security card's state: off (the Set up card) or on with the
        turned-on date and the codes-left line.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: When two-step verification was turned on; null while off.
        recovery_codes_remaining:
          type: integer
          minimum: 0
          nullable: true
          description: Unused codes in the current set; null while off.
        recovery_codes_total:
          type: integer
          minimum: 0
          nullable: true
          description: Size of the current set; null while off.

    TotpSetup:
      type: object
      description: >
        Setup step 1. Every field is drawn on settings-2fa-setup: the QR, the
        always-visible manual key, and the account line beneath it. Time-based,
        thirty-second period, six digits.
      required: [secret, otpauth_uri, qr_svg]
      properties:
        secret:
          type: string
          description: >
            The manual key: the 160-bit secret, base32 without padding. The
            client renders it in groups of four.
        otpauth_uri:
          type: string
          description: What the QR encodes; issuer and account back the account line.
        qr_svg:
          type: string
          description: >
            Server-rendered inline SVG of the QR. Rendered per request from
            the secret, never stored as an image.

    VerifyTotpSetupRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Six digits from the authenticator; recovery codes are not valid here.

    RecoveryCodes:
      type: object
      description: >
        Ten single-use codes in the design's XXXX-XXXX format, shown exactly
        once — the server keeps only argon2id hashes and can never display
        them again. Regeneration replaces the entire set.
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"

    SessionFamily:
      type: object
      description: >
        One signed-in device — a refresh-token family. Every field is one a
        settings-sessions row draws.
      required: [family_id, user_agent, last_active_at, current]
      properties:
        family_id:
          type: string
          format: uuid
        user_agent:
          type: string
          description: >
            Raw User-Agent of the family's newest generation; the client
            derives the device and browser labels from it.
        ip:
          type: string
          nullable: true
          description: The newest generation's recorded address, verbatim.
        location:
          type: string
          nullable: true
          description: >
            IP-estimated and labelled approximate in the UI. Null renders as
            Unknown location, and stays null until a geolocation source is
            chosen — so it can light up later without a contract change.
        last_active_at:
          type: string
          format: date-time
          description: >
            Approximate: the newest generation's created_at. Refreshes are the
            observable heartbeat, so precision is the access-token lifetime,
            which is why the design labels these rows approximate.
        current:
          type: boolean
          description: >
            True for the family that authenticated this request — the row with
            the this-device badge and no sign-out control of its own.

    SessionFamilyList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionFamily"

    Presence:
      type: string
      description: >
        online — a live socket. away — the client reported itself idle.
        offline — no socket after a short grace period.
      enum: [online, away, offline]

    UserSummary:
      type: object
      description: >
        The public face of a user: everything the chat shell draws (name row,
        avatar initials and tint are derived client-side from display_name and
        id) and nothing else. Never carries email, role, or password state.
      required: [id, username, display_name]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        presence:
          allOf:
            - $ref: "#/components/schemas/Presence"
          description: >
            Present only where the design shows presence — the DM peer and the
            user directory. Message authors carry no presence.

    UserSummaryPage:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        next_cursor:
          type: string
          description: Present when another page exists.

    ChannelKind:
      type: string
      description: >
        Flat channel kinds (ADR 001 — no org or team layer). In Phase 1.2
        visibility is membership for all three; `kind` is stored so a channel
        directory and join flow can arrive without a schema change.
      enum: [public, private, dm]

    Channel:
      type: object
      description: >
        One conversation. Only members ever receive a Channel — every
        channel-scoped path answers 404 to everyone else.
      required:
        [id, kind, topic, member_count, unread_count, mention_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelKind"
        slug:
          type: string
          nullable: true
          description: >
            The name the sidebar renders after "#". Unique across non-DM
            channels; null for a direct message, which the client labels with
            dm_peer.display_name instead.
        topic:
          type: string
          maxLength: 250
          description: >
            Empty string when unset — the header renders its own "No topic set"
            copy. Always empty for a direct message.
        member_count:
          type: integer
          minimum: 0
          description: The count drawn beside the channel name in the header.
        dm_peer:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          description: The other person. Present only when kind is dm.
        unread_count:
          type: integer
          minimum: 0
          description: >
            Messages after the caller's read position, excluding the caller's
            own messages and deleted ones.
        mention_count:
          type: integer
          minimum: 0
          description: >
            The subset of unread_count that mentions the caller — the sidebar's
            filled "@" badge, as opposed to the outlined plain-unread count.
        last_read_message_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the "New messages" divider goes on entry. Null when the caller
            has never read the channel.
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the newest message; null in an empty channel.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: >
            Who created the channel — the empty state says "You created this
            channel today". Null if that account no longer exists.
        created_at:
          type: string
          format: date-time

    ChannelPage:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        next_cursor:
          type: string
          description: Present when another page exists.

    ChannelRef:
      type: object
      description: >
        Enough of a channel to label a search result — "#deploys" for a channel,
        the peer's display name for a direct message.
      required: [id, kind]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelKind"
        slug:
          type: string
          nullable: true
        dm_peer:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          description: Present only when kind is dm.

    CreateChannelRequest:
      type: object
      required: [slug, kind]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9_-]*$"
        kind:
          type: string
          description: Direct messages are opened through /api/v1/dms, not here.
          enum: [public, private]
        topic:
          type: string
          maxLength: 250
          default: ""

    UpdateChannelRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          maxLength: 250
          description: Empty string clears the topic.

    OpenDirectMessageRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: The other person. Must not be the caller.

    AddChannelMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    MemberPage:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        next_cursor:
          type: string
          description: Present when another page exists.

    UpdateCurrentUserRequest:
      type: object
      description: >
        Only the fields present are changed. Locale is the only one: a screen
        that edits your own display name does not exist yet, and an endpoint
        that accepts a field nothing sends is a field nothing tests.
      properties:
        locale:
          type: string
          enum: [en, fa]

    AdminUserPage:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          type: string
          description: Present when another page exists.

    AdminUser:
      type: object
      description: >
        A row of the users table. Carries what the dashboard shows and
        nothing more — never a password hash, never a session token.
      required: [id, username, display_name, is_admin, is_active, must_change_password, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string }
        is_admin: { type: boolean }
        is_active:
          type: boolean
          description: False for a deactivated account — it cannot sign in and holds no sessions.
        must_change_password: { type: boolean }
        has_totp:
          type: boolean
          description: >
            Whether the account has a second factor. The org-settings screen
            uses it to say who enforcement will affect.
        created_at: { type: string, format: date-time }

    UpdateUserAdminRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        is_admin: { type: boolean }
        is_active: { type: boolean }

    TemporaryCredentials:
      type: object
      description: >
        Shown once and never again — the password is stored only as an
        argon2id hash, so there is nothing to redisplay.
      required: [username, temporary_password]
      properties:
        username: { type: string }
        temporary_password: { type: string }

    CreateInviteRequest:
      type: object
      properties:
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
        note:
          type: string
          maxLength: 200
          description: What this link is for; shown in the table, never to the invitee.

    CreatedInvite:
      type: object
      description: >
        The link is in this response and nowhere else: only its hash is
        stored, exactly as password-reset tokens are.
      required: [id, url, expires_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        expires_at: { type: string, format: date-time }

    ScimToken:
      type: object
      description: A provisioning token as the table lists it. Never the token.
      required: [id, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        note: { type: string, nullable: true }
        created_by: { $ref: "#/components/schemas/UserSummary" }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Null until the provider first authenticates with it. It is how an
            administrator tells a token that was configured from one that was
            minted and forgotten.

    ScimTokenPage:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ScimToken"

    CreateScimTokenRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 200
          description: >
            Optional, and only administrators see it. It exists so a list of
            opaque tokens can say which system holds which.

    CreatedScimToken:
      type: object
      required: [token, scim]
      properties:
        token:
          type: string
          description: >
            Shown once and never again. Only its hash is kept.
        scim:
          $ref: "#/components/schemas/ScimToken"

    Invite:
      type: object
      description: An open invite, as the table lists it. Never the link itself.
      required: [id, created_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        created_by: { $ref: "#/components/schemas/UserSummary" }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InvitePage:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
        next_cursor: { type: string }

    InvitePreview:
      type: object
      description: >
        What the redemption screen draws before anybody has an account.
        Deliberately says nothing about who issued the invite or for whom.
      required: [org_name]
      properties:
        org_name: { type: string }

    RedeemInviteRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: >
            The same bound every other password field carries. A shorter one
            here would refuse a passphrase at redemption that the account
            could set five minutes later.
        # 120 is the database's CHECK on users.display_name, and every schema
        # carrying the field states that same bound. This one said 64 until
        # 1.5, which made an invitation the one way to be given a name you
        # could not accept: an administrator could set 65-120 characters
        # through AdminCreateUserRequest, and redemption refused it.
        display_name: { type: string, maxLength: 120 }

    RegistrationMode:
      type: string
      description: >
        How accounts come into existence. `invite` is the default and the
        safe one; `open` lets anybody with the URL create an account, which
        is why the screen warns about it.
      enum: [invite, open]

    OrgSettings:
      type: object
      required: [org_name, default_locale, registration_mode, require_totp, session_lifetime_hours]
      properties:
        org_name: { type: string, maxLength: 64 }
        default_locale:
          type: string
          enum: [en, fa]
          description: The locale a new account starts in.
        registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
        require_totp:
          type: boolean
          description: >
            Enforced at the next sign-in, never mid-session — turning it on
            must not lock out the admin who turned it on. The mechanism is
            User.totp_enrollment_required, which is decided once when a
            session is minted; see that field.
        accounts_without_totp:
          type: integer
          minimum: 0
          description: >
            How many accounts enforcement would affect. Read-only, and the
            reason the screen can say who it hits before it is turned on.
        session_lifetime_hours:
          type: integer
          minimum: 1
          maximum: 8760
          description: >
            How long a session may live before its refresh token expires,
            read at every mint, including the rotation a refresh performs.
            Shortening it does not retroactively end an already-issued
            window, so an idle session keeps the window it has.

            Read what it governs carefully: it bounds how long a session may
            go UNUSED, not how long it may exist. A client that keeps
            refreshing renews its window each time and can stay signed in
            indefinitely — which is also why "enforced at the next sign-in"
            can, for a continuously active client, mean a long time. Ending a
            specific session now is what the device list and administrative
            deactivation are for. The server's own maximum is the ceiling, so
            a value above it is clamped rather than refused.

    UpdateOrgSettingsRequest:
      type: object
      description: Only the fields present are changed; each saves on its own.
      properties:
        org_name: { type: string, maxLength: 64 }
        default_locale: { type: string, enum: [en, fa] }
        registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
        require_totp: { type: boolean }
        session_lifetime_hours: { type: integer, minimum: 1, maximum: 8760 }

    AuditEntry:
      type: object
      description: >
        One recorded action. `actor` is null for something the system did
        rather than a person.
      required: [id, action, occurred_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: Namespaced verb, e.g. user.deactivated, invite.created.
        actor:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        target_id: { type: string, format: uuid, nullable: true }
        target_label:
          type: string
          nullable: true
          description: >
            What the target was called when this happened, kept so the log
            still reads correctly after a rename or a deletion.
        detail:
          type: object
          additionalProperties: true
          nullable: true
        ip: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [entries, chain_valid]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        chain_valid:
          type: boolean
          description: >
            False means the hash chain over the returned entries does not
            verify — somebody edited or removed a row in the database. It is
            not a display concern.
        next_cursor: { type: string }

    Attachment:
      type: object
      description: >
        A file card in the message list. Read-only on Message: attachments are
        created by the Phase 1.3 upload pipeline, so until that slice lands the
        array is always empty. Every field here is one the design draws — name,
        type and size on the generic card; pixel dimensions and a thumbnail on
        the image card; a download control on both.
      required: [id, filename, content_type, size_bytes, url]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          description: The card's short type label ("PDF", "PNG") is derived from this.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        width:
          type: integer
          nullable: true
          description: Images only — the card's "1600 × 900" line.
        height:
          type: integer
          nullable: true
        url:
          type: string
          description: >
            Download target on the cookie-less files origin. Signed and
            expiring (about an hour): that origin carries no cookies, so a
            fresh URL is the credential, minted every time an Attachment is
            serialized for somebody entitled to see it. Stale ones answer 404
            — re-fetch the message for fresh links, never store these.
        thumbnail_url:
          type: string
          nullable: true
          description: >
            Images only — the card's preview, signed and expiring like url.
            Thumbnails are derivatives generated at ingest from the stripped
            original, bounded to 512px on the long edge.

    LinkPreview:
      type: object
      description: >
        The link-preview card: image, title, description, and the host line the
        client derives from url. Read-only, and always absent until the Phase
        1.3 egress preview proxy exists.
      required: [url]
      properties:
        url:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: >
            Always on this instance's own files origin, never the remote
            site: the preview image is fetched by the server through the same
            egress guard as the page, stored as a bounded derivative, and
            served signed like any attachment. A reader's browser must never
            be made to fetch a stranger's server — and the strict img-src
            'self' CSP would refuse it anyway.

    Message:
      type: object
      required: [id, channel_id, author, client_msg_id, content, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/UserSummary"
        client_msg_id:
          type: string
          format: uuid
          description: >
            The sender's idempotency key, echoed back so an optimistic bubble
            can be reconciled with the stored message.
        content:
          type: string
          maxLength: 4000
          description: >
            Markdown source. The client renders it through a strict sanitizer —
            the server never returns HTML. Empty string once the message is
            deleted.
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: Non-null renders the "(edited)" marker.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Non-null renders the dashed "Message removed" placeholder. The row
            keeps its place in history so the conversation never reshapes.
        attachments:
          type: array
          description: Always empty until the Phase 1.3 upload pipeline lands.
          items:
            $ref: "#/components/schemas/Attachment"
        link_preview:
          allOf:
            - $ref: "#/components/schemas/LinkPreview"
          description: Absent until the Phase 1.3 preview proxy lands.

    MessagePage:
      type: object
      description: >
        One page of history, always ordered ascending by (created_at, id). The
        two cursors are the handles for the next scrollback and the next
        forward fetch; each is absent when there is nothing more in that
        direction.
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        before_cursor:
          type: string
          description: Pass as `before` to fetch the previous (older) page.
        after_cursor:
          type: string
          description: Pass as `after` to fetch the next (newer) page.

    SendMessageRequest:
      type: object
      required: [client_msg_id, content]
      properties:
        attachment_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
          description: >
            Files previously uploaded to this channel by this caller and not
            yet attached to any message, attached atomically with the send. An
            id that names anything else — another channel's file, another
            person's, one already attached — answers 404 attachment_not_found,
            one code for every miss so nothing about other people's uploads
            leaks. Duplicates in the list are a 400.

        client_msg_id:
          type: string
          format: uuid
          description: >
            Generated by the client once per message and reused verbatim on
            every retry. Unique per (channel, author).
        content:
          type: string
          minLength: 0
          maxLength: 4000
          description: >
            Markdown as authored. May be empty only when attachment_ids is
            non-empty — an image with no caption is an ordinary message, a
            message with neither text nor files is nothing (400). One
            extension: a mention is the literal
            token `<@{user_id}>`. The composer's picker inserts the token and
            renders it as the person's display name; the server parses tokens
            (never display names) to populate mention counts. Display names are
            not unique, are not stable, and in Persian cannot match the username
            pattern at all — so the wire format carries the id and the rendering
            carries the name.

    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000

    SetReadPositionRequest:
      type: object
      required: [message_id]
      properties:
        message_id:
          type: string
          format: uuid
          description: >
            The newest message the caller has seen. Must belong to this channel.

    SearchKind:
      type: string
      description: >
        The two tabs above the results. `files` searches filenames, scoped by
        channel membership exactly as messages are.
      enum: [messages, files]
      default: messages

    SearchSnippetPart:
      type: object
      required: [text, match]
      properties:
        text:
          type: string
        match:
          type: boolean
          description: True for the run the query matched; the client highlights it.

    SearchSnippet:
      type: object
      description: >
        A snippet as alternating plain and matched runs. Never HTML — the
        design's highlight is drawn from `match`, so a message body can never
        inject markup through search results.
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/SearchSnippetPart"

    SearchResult:
      type: object
      description: >
        One hit. For kind=messages: where it was said, by whom, when, and the
        matching run of text. For kind=files the same shape carries the
        attachment, and the snippet runs over the filename — same matching,
        same honesty about it (substrings, not stems). message_id points at
        the message the file rode in on, which is where a click lands.
      required: [message_id, channel, author, created_at, snippet]
      properties:
        message_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/ChannelRef"
        author:
          $ref: "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        snippet:
          $ref: "#/components/schemas/SearchSnippet"
        attachment:
          allOf:
            - $ref: "#/components/schemas/Attachment"
          description: Present exactly when kind is files.

    SearchPage:
      type: object
      required: [kind, results, total, total_capped]
      properties:
        kind:
          $ref: "#/components/schemas/SearchKind"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer
          minimum: 0
          description: >
            Exact match count, counted up to 200 — the "4 results for …" line.
        total_capped:
          type: boolean
          description: True when there were more than 200 matches and total is the cap.
        next_cursor:
          type: string
          description: Present when another page exists.
