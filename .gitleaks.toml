# Hamlaneh secret-scanning configuration.
#
# The default rule set is kept in full — this file only records the narrow,
# reasoned exceptions. An entry here is a claim that something LOOKS like a
# secret but cannot authenticate anything; never use it to quiet a real one.
#
# Inline `// gitleaks:allow` on the offending line is preferred for new code,
# because the reason then lives where a reviewer will read it. Path entries
# exist for findings already written into git history, which an inline comment
# added later cannot reach.

title = "Hamlaneh"

[extend]
useDefault = true

[[allowlists]]
description = "Password-strength scorer fixtures: a table of INPUTS to a pure scoring function. Each string exists to exercise a length or character-class branch, and nothing in the system accepts any of them as a credential. Committed in f4f35bf before the inline marker existed, so the exemption is path-scoped to cover history."
paths = ['''webapp/src/auth/passwordStrength\.test\.ts$''']

[[allowlists]]
description = """
Two placeholder credentials that the default generic-api-key rule reads as \
high-entropy because they are long and hex/base32 shaped. Both are structurally \
impossible as real secrets — one counts 0-9a-f and starts over, the other repeats \
a single 16-character block twice — and neither authenticates anything: the reset \
token is handed to a fake store, and the TOTP secret only ever reaches an MSW mock. \
Scoped to the exact values rather than to their files, because the claim being made \
is about the strings themselves and stays true wherever they appear. Any edit to \
either value fails the scan again, which is the point: re-approval is deliberate.\
"""
regexes = [
  '''^0123456789abcdef0123456789abcdef012345678$''',
  '''^KZ4W9TQR2MHD7FJXKZ4W9TQR2MHD7FJX$''',
]

[[allowlists]]
description = """
The file-URL signing-key fixture: 32 bytes of 0-9a-f counted twice over,
shared by the filesign tests and the files-origin tests. Structurally
impossible as a secret and wired to nothing — the servers under test are
constructed with it in-process, and the real key is generated at install
into an untracked .env. Value-scoped like the other fixtures: any edit to
the value fails the scan again, which is the point."""
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
]

[[allowlists]]
description = """
Two Rust CRATE NAMES, not a credential. webapp/src-mls/Cargo.lock records \
that several libcrux crates depend on `libcrux-secrets`, and the word \
"secrets" makes the generic-api-key rule read that as a keyword and take the \
NEXT dependency entry, `libcrux-sha3`, as its value. Both are package names \
cargo resolves against crates.io. The lockfile carries no credential at all: \
its only opaque values are `checksum` digests, which are public content \
hashes of published crates.

Scoped as narrowly as the rule engine allows — three conditions that must ALL \
hold (condition = "AND", each half verified against gitleaks 8.30.1 by \
flipping it and watching the finding come back):

  targetRules  only generic-api-key is exempted here; every other rule
               (private-key, github-pat, aws-*, ...) still fires in this file
  paths        only this one lockfile
  regexes      regexTarget = "match" against the WHOLE matched text, anchored,
               naming both crates literally

So the exemption covers exactly one two-line shape in one file under one rule. \
A real key pasted anywhere in this lockfile — including onto the line right \
after `libcrux-secrets` — changes the matched text and fails the scan, and so \
does a cargo update that reorders these dependencies. Re-approving it is then \
a deliberate act, which is the point.\
"""
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)webapp/src-mls/Cargo\.lock$''']
regexTarget = "match"
regexes = ['''^libcrux-secrets",\n "libcrux-sha3"$''']
